<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📷 pCameraH5</title>
    <style>
      .btns {
        width: 520px;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      .btns button {
        margin: 5px 10px;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        background-color: #007bff;
        color: #fff;
        cursor: pointer;
      }
      .btns button#destroy {
        background-color: #dc3545;
      }
    </style>
  </head>

  <body>
    <div id="el" style="width: 520px; height: 300px"></div>
    <div class="btns">
      <button id="capture">拍照</button>
      <button id="record">录像</button>
      <button id="switch">切换摄像头</button>
      <button id="destroy">销毁</button>
    </div>
    <script src="../lib/p-camera-h5.umd.js"></script>
    <script>
      const download = (file) => {
        const a = document.createElement("a");
        const url = URL.createObjectURL(file);
        a.href = url;
        a.style.display = "none";
        a.download = file.name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };
      const two = (n) => String(n).padStart(2, "0");
      const formatTime = () => {
        const d = new Date();
        return `${d.getFullYear()}-${two(d.getMonth() + 1)}-${two(d.getDate())} ${two(d.getHours())}:${two(d.getMinutes())}:${two(d.getSeconds())}`;
      };

      const el = document.querySelector("#el");
      const captureBtn = document.querySelector("#capture");
      const recordBtn = document.querySelector("#record");
      const switchBtn = document.querySelector("#switch");
      const destroyBtn = document.querySelector("#destroy");

      const recordState = { timer: null, time: 0 };
      let currentCamera = null;
      let currentFacingMode = "environment";
      // PC 端始终镜像；移动端仅前置摄像头镜像
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      const shouldMirror = () => (isMobile ? currentFacingMode === "user" : true);

      const onCapture = (camera) => {
        camera.capture().then(download);
      };

      const onRecord = (camera) => {
        if (!camera.isRecording()) {
          camera.startRecording().then(() => {
            recordBtn.textContent = "结束（0s）";
            recordBtn.style.backgroundColor = "#dc3545";
            recordState.time = 0;
            recordState.timer = setInterval(() => {
              recordState.time++;
              recordBtn.textContent = "结束（" + recordState.time + "s）";
            }, 1000);
          });
        } else {
          camera.stopRecording().then((file) => {
            download(file);
            clearInterval(recordState.timer);
            recordBtn.style.backgroundColor = "#007bff";
            recordBtn.textContent = "录像";
          });
        }
      };

      const onDestroy = (camera) => {
        camera.destroy();
      };

      const buildWatermark = () => [
        {
          x: 10,
          y: 28,
          text: { content: "📷 pCameraH5" },
        },
        {
          x: 10,
          y: 58,
          // 动态时间水印：传函数，每帧刷新
          text: { content: formatTime, color: "#fff", fontSize: 16 },
        },
      ];

      const onSwitch = () => {
        if (!currentCamera) return;
        currentCamera.destroy();
        currentCamera = null;
        // 重置录像按钮状态
        clearInterval(recordState.timer);
        recordBtn.style.backgroundColor = "#007bff";
        recordBtn.textContent = "录像";
        // 切换朝向并重新初始化
        currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
        initCamera();
      };

      const initCamera = () => {
        pCameraH5
          .createCamera({
            el,
            facingMode: currentFacingMode,
            isMirror: shouldMirror(),
            watermark: buildWatermark(),
          })
          .then((camera) => {
            currentCamera = camera;
          })
          .catch((err) => {
            console.error(err);
          });
      };

      captureBtn.addEventListener("click", () => currentCamera && onCapture(currentCamera));
      recordBtn.addEventListener("click", () => currentCamera && onRecord(currentCamera));
      switchBtn.addEventListener("click", onSwitch);
      destroyBtn.addEventListener("click", () => currentCamera && onDestroy(currentCamera));

      initCamera();
    </script>
  </body>
</html>
